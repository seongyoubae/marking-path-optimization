name: Public example checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements_dev.txt
      - run: python -m ruff check .
      - run: python -m pytest -q -m 'not gurobi'
      - run: python -m src.run --population 8 --generations 5
      - run: python -m analysis.plot_route
      - run: python -m analysis.illustrate_problem --output outputs/problem.svg
