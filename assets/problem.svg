<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1110" viewBox="0 0 1280 1110" role="img" aria-labelledby="title desc">
<title id="title">Marking route on shipbuilding-style parts</title>
<desc id="desc">Eight independently designed synthetic plate parts: brackets, web plates, tapered strips and a floor plate, with rounded openings and edge cutouts. Red arrows represent reversible marking strokes inside each part. Dashed navy arrows connect the origin, selected entries and exits, and return to the origin. Operation IDs are numbered from one. This manually selected route illustrates the paired-endpoint model; part outlines are not collision constraints.</desc>
