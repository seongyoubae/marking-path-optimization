<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1110" viewBox="0 0 1280 1110" role="img" aria-labelledby="title desc">
<title id="title">Marking operations and the travel between their endpoints</title>
<desc id="desc">An original synthetic layout with four independently constructed shipbuilding-style contours. Two larger parts each contain three marking operations; two smaller brackets each contain one. Eight numbered red strokes have reversible paired endpoints. Dashed connectors show the origin approach, transfers and return. The example order ends with operation eight followed by operation seven. Coordinates and route are illustrative. Contours are not collision constraints.</desc>
