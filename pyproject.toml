[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["gurobi: optional licensed solver checks"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Preserve mathematical indices and the sensitivity source's exception handling.
"baselines/gurobi.py" = ["E741"]
"experiments/sensitivity_optimizer.py" = ["E722"]
